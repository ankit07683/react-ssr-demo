name: workflow 2

on:
  workflow_dispatch: #manual trigger


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false   # Disable post-checkout cleanup

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Run Commsnd 
        run: node ./sendemail.js


      
