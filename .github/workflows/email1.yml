name: Workflow1

on:
  workflow_dispatch: #manual trigger


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Run Commsnd 
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/email2.yml/dispatches \
            -d '{"ref":"main"}'


      
